name: Phase 1 canonical consistency

on:
  push:
    branches: [phase1-canonical-consistency]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-canonical-consistency
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply Phase 1 patch
        run: python scripts/phase1_canonical_consistency.py
      - name: Frontend install
        run: npm ci
      - name: Frontend typecheck
        run: npm run typecheck
      - name: Frontend build
        run: npm run build
      - name: Backend install
        run: npm --prefix backend ci
      - name: Backend build
        run: npm --prefix backend run build
      - name: Commit verified Phase 1 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src backend/src
          git commit -m "Phase 1: canonical consistency clean-up"
          git rm scripts/phase1_canonical_consistency.py .github/workflows/phase1-canonical-consistency.yml
          git commit -m "chore: remove temporary Phase 1 patch runner"
          git push origin HEAD:phase1-canonical-consistency
