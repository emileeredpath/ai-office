name: Verify Phase 1
on:
  push:
    branches: [phase1-canonical-consistency]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm --prefix backend ci
      - run: npm --prefix backend run build
