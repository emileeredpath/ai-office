name: Phase 1 comment cleanup
on:
  push:
    branches: [phase1-canonical-consistency]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-canonical-consistency
          fetch-depth: 0
      - run: python scripts/phase1_comment_cleanup.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/screens/PerformanceScreen.tsx backend/src/routes/analytics.ts
          git commit -m "Phase 1: align comments and spend scope labels"
          git rm scripts/phase1_comment_cleanup.py .github/workflows/phase1-comment-cleanup.yml
          git commit -m "chore: remove temporary comment cleanup runner"
          git push origin HEAD:phase1-canonical-consistency
