<!DOCTYPE html>
<!--
  MTech Brentwood Communications — Interactive Communication Systems Showcase

  This file works two ways:
  1. Standalone: open it directly in a browser, or host it anywhere as-is.
  2. WordPress: copy everything from <div id="mtech-showcase-app"> down to the
     closing </script> tag into a "Custom HTML" block (or the shortcode wrapper
     described in README.md). The <!doctype>/<html>/<head>/<body> wrapper below
     is only needed for standalone use and can be discarded in WordPress.

  See README.md for installation, customization and the WordPress shortcode.
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Interactive Communication Systems Showcase — MTech Brentwood</title>
</head>
<body>

<div id="mtech-showcase-app" class="mtech-showcase">
  <div class="showcase-grid">

    <!-- Illustration -->
    <div class="illustration-panel">
      <div class="illustration-frame">
        <img
          :src="illustrationSrc"
          alt="MTech Brentwood building cutaway illustration showing communication technologies"
          class="illustration-img"
        />
        <button
          v-for="marker in markers"
          :key="marker.id"
          type="button"
          class="marker"
          :class="{ 'marker--active': activeId === marker.id }"
          :style="{ left: marker.x + '%', top: marker.y + '%' }"
          :aria-label="'View details for ' + marker.title"
          :aria-pressed="activeId === marker.id"
          @click="selectMarker(marker.id)"
        >
          <span class="marker-pulse"></span>
          <span class="marker-dot"></span>
        </button>
      </div>
    </div>

    <!-- Popup panel -->
    <div class="popup-panel">
      <div class="popup-card" v-if="activeMarker" :key="activeMarker.id">
        <button type="button" class="popup-close" aria-label="Close" @click="closeMarker">✕</button>
        <div class="popup-icon">{{ activeMarker.icon }}</div>
        <h3 class="popup-title">{{ activeMarker.title }}</h3>
        <p class="popup-description">{{ activeMarker.description }}</p>
        <a :href="activeMarker.link" class="popup-cta">Learn More</a>

        <div class="popup-nav">
          <button type="button" class="popup-nav-btn" @click="cycleMarker(-1)" aria-label="Previous technology">‹</button>
          <span class="popup-nav-count">{{ activeIndex + 1 }} / {{ markers.length }}</span>
          <button type="button" class="popup-nav-btn" @click="cycleMarker(1)" aria-label="Next technology">›</button>
        </div>
      </div>

      <div class="popup-placeholder" v-else>
        <p>Select a technology marker on the illustration to learn more.</p>
      </div>
    </div>

  </div>
</div>

<style>
  #mtech-showcase-app,
  #mtech-showcase-app * {
    box-sizing: border-box;
  }

  .mtech-showcase {
    --mtech-navy: #1d2a3a;
    --mtech-blue: #3a82c6;
    --mtech-orange: #ef5f12;
    --mtech-orange-dark: #d94d0a;
    --mtech-light-grey: #f8f9fa;
    --mtech-text-grey: #666;
    --mtech-border-grey: #e8e8e6;

    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Aptos', sans-serif;
    color: var(--mtech-navy);
  }

  .showcase-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 40px;
  }

  /* ---------- Illustration ---------- */
  .illustration-panel {
    background: var(--mtech-light-grey);
    border: 1px solid var(--mtech-border-grey);
    border-radius: 12px;
    padding: 30px;
  }

  .illustration-frame {
    position: relative;
    width: 100%;
    /* Fixed ratio keeps markers correctly placed while the image loads (or if it
       fails to load) instead of collapsing to zero height. Match this to the
       final illustration's actual width/height ratio. */
    aspect-ratio: 4 / 3;
    border-radius: 8px;
    overflow: hidden;
    background: #eef1f3;
  }

  .illustration-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .marker {
    position: absolute;
    transform: translate(-50%, -50%);
    width: 28px;
    height: 28px;
    padding: 0;
    border: none;
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }

  .marker-dot {
    position: relative;
    z-index: 2;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--mtech-blue);
    border: 2px solid #fff;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
    transition: transform 0.2s ease, background 0.2s ease;
  }

  .marker-pulse {
    position: absolute;
    z-index: 1;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--mtech-blue);
    animation: mtech-pulse 2s ease-out infinite;
  }

  @keyframes mtech-pulse {
    0% {
      transform: scale(1);
      opacity: 0.7;
    }
    100% {
      transform: scale(2.6);
      opacity: 0;
    }
  }

  .marker:hover .marker-dot {
    transform: scale(1.1);
  }

  .marker--active .marker-dot {
    background: var(--mtech-orange);
    transform: scale(1.15);
  }

  .marker--active .marker-pulse {
    background: var(--mtech-orange);
  }

  .marker:focus-visible .marker-dot {
    outline: 2px solid var(--mtech-orange);
    outline-offset: 2px;
  }

  /* ---------- Popup panel ---------- */
  .popup-panel {
    position: relative;
  }

  .popup-card,
  .popup-placeholder {
    background: #fff;
    border: 1px solid var(--mtech-border-grey);
    border-radius: 12px;
    padding: 25px;
  }

  .popup-placeholder {
    color: var(--mtech-text-grey);
    text-align: center;
    font-size: 15px;
  }

  .popup-card {
    position: relative;
    animation: mtech-fade-in 0.3s ease;
  }

  @keyframes mtech-fade-in {
    from {
      opacity: 0;
      transform: translateY(6px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .popup-close {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1px solid var(--mtech-border-grey);
    background: var(--mtech-light-grey);
    color: var(--mtech-navy);
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  .popup-close:hover {
    background: #eee;
  }

  .popup-icon {
    font-size: 36px;
    margin-bottom: 12px;
  }

  .popup-title {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 12px;
    padding-right: 30px;
    color: var(--mtech-navy);
  }

  .popup-description {
    font-size: 15px;
    font-weight: 400;
    line-height: 1.6;
    color: var(--mtech-text-grey);
    margin: 0 0 20px;
  }

  .popup-cta {
    display: inline-block;
    background: var(--mtech-orange);
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    font-size: 14px;
    padding: 12px 26px;
    border-radius: 6px;
    transition: background 0.2s ease;
  }

  .popup-cta:hover {
    background: var(--mtech-orange-dark);
  }

  .popup-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid var(--mtech-border-grey);
  }

  .popup-nav-btn {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1px solid var(--mtech-border-grey);
    background: var(--mtech-light-grey);
    color: var(--mtech-navy);
    font-size: 16px;
    cursor: pointer;
  }

  .popup-nav-btn:hover {
    background: #eee;
  }

  .popup-nav-count {
    font-size: 13px;
    color: var(--mtech-text-grey);
  }

  /* ---------- Desktop layout ---------- */
  @media (min-width: 1024px) {
    .showcase-grid {
      grid-template-columns: 1.4fr 1fr;
      align-items: start;
    }

    .popup-panel {
      position: sticky;
      top: 20px;
    }
  }

  /* ---------- Tablet ---------- */
  @media (min-width: 768px) and (max-width: 1023px) {
    .illustration-panel {
      padding: 24px;
    }
  }

  /* ---------- Mobile ---------- */
  @media (max-width: 767px) {
    .mtech-showcase {
      padding: 12px;
    }

    .illustration-panel {
      padding: 16px;
      border-radius: 10px;
    }

    .popup-card,
    .popup-placeholder {
      padding: 20px;
    }

    .marker {
      width: 34px;
      height: 34px;
    }

    .marker-dot {
      width: 16px;
      height: 16px;
    }

    .popup-title {
      font-size: 19px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .marker-pulse {
      animation: none;
      opacity: 0.5;
    }
    .popup-card {
      animation: none;
    }
  }
</style>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script>
  (function () {
    const { createApp, ref, computed } = Vue;

    createApp({
      setup() {
        // Swap this for the final architectural illustration URL.
        const illustrationSrc = ref('building-illustration.png');

        // Edit this array to add, remove, reorder or reposition technologies.
        // x/y are percentages of the illustration's width/height.
        const markers = ref([
          { id: 'radio', title: 'Two-Way Radios', description: 'Own your communication. Stay in control.', icon: '📡', link: '/radio-communications/', x: 15, y: 30 },
          { id: 'poc', title: 'PoC Radios', description: 'All-in-one device. Smart communications. Lower costs.', icon: '📱', link: '/poc-radios/', x: 32, y: 20 },
          { id: 'cctv', title: 'CCTV & Access Control', description: 'See clearly. Stay in control. Protect what matters.', icon: '🎥', link: '/cctv-access-control/', x: 78, y: 25 },
          { id: 'bodycam', title: 'Body Worn Cameras', description: 'See everything, miss nothing.', icon: '🎦', link: '/body-worn-cameras/', x: 60, y: 45 },
          { id: 'sensors', title: 'Smart Sensors', description: 'Smart monitoring for safer environments.', icon: '📶', link: '/smart-sensors/', x: 20, y: 65 },
          { id: 'av', title: 'Audio Visual', description: 'Radio and audio-visual solutions for events and venues worldwide.', icon: '🔊', link: '/audio-visual/', x: 45, y: 75 },
          { id: 'ai', title: 'MTech AI', description: 'Every voice becomes action. Transform your radio network into a 24/7 virtual dispatcher.', icon: '🤖', link: '/mtech-ai/', x: 70, y: 68 },
          { id: 'drones', title: 'Drones', description: 'Smarter. Safer. Faster. Capture aerial data and improve site safety.', icon: '🚁', link: '/drones/', x: 85, y: 82 },
        ]);

        const activeId = ref(null);

        const activeIndex = computed(() =>
          markers.value.findIndex((m) => m.id === activeId.value)
        );

        const activeMarker = computed(() =>
          activeIndex.value === -1 ? null : markers.value[activeIndex.value]
        );

        function selectMarker(id) {
          activeId.value = activeId.value === id ? null : id;
        }

        function closeMarker() {
          activeId.value = null;
        }

        function cycleMarker(step) {
          if (!markers.value.length) return;
          const current = activeIndex.value === -1 ? 0 : activeIndex.value;
          const next = (current + step + markers.value.length) % markers.value.length;
          activeId.value = markers.value[next].id;
        }

        return {
          illustrationSrc,
          markers,
          activeId,
          activeIndex,
          activeMarker,
          selectMarker,
          closeMarker,
          cycleMarker,
        };
      },
    }).mount('#mtech-showcase-app');
  })();
</script>

</body>
</html>
